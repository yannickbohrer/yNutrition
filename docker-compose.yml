services:
  app:
    build: .
    image: ${NUTRITION_IMAGE:-nutrition:latest}
    container_name: nutrition
    restart: unless-stopped
    env_file: .env
    environment:
      # the container always listens on 3000; PORT in .env is the host port
      PORT: '3000'
      DATABASE_PATH: /data/nutrition.db
      # behind a reverse proxy, which appends the resolved client IP to
      # X-Forwarded-For. ORIGIN (in .env) fixes protocol/host for cookies and WebAuthn.
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: '1'
      PROTOCOL_HEADER: x-forwarded-proto
      # allow backup imports larger than adapter-node's 512K default
      BODY_SIZE_LIMIT: 50M
    ports:
      # default: localhost only — a reverse proxy (Apache) on the same host forwards to it
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000'
    volumes:
      - nutrition-data:/data
    mem_limit: 384m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  nutrition-data:
