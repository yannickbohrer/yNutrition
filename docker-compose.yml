services:
  app:
    build: .
    image: nutrition:latest
    container_name: nutrition
    restart: unless-stopped
    env_file: .env
    environment:
      # the container always listens on 3000; PORT in .env is the host port the reverse proxy connects to
      PORT: '3000'
      DATABASE_PATH: /data/nutrition.db
      # behind the reverse proxy: client IP from X-Forwarded-For (last hop = the reverse proxy).
      # ORIGIN (in .env) fixes protocol/host, so cookies are Secure and WebAuthn origin checks match.
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: '1'
      PROTOCOL_HEADER: x-forwarded-proto
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${PORT:-3000}:3000'
    volumes:
      - nutrition-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  nutrition-data:
